<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Assistant Console</title>
    <style>
      :root {
        --bg: #30353c;
        --text: #e7eaee;
        --muted: #a4abb4;
        --border: #4c545e;
        --accent: #007a6e;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px -apple-system,
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 32px;
        text-align: center;
      }
      #spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #title {
        font-size: 15px;
      }
      #status {
        color: var(--muted);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div id="spinner"></div>
    <div id="title">Downloading additional components…</div>
    <div id="status"></div>
    <script>
      const status = document.getElementById("status");
      window.api.voice.onStatus((text) => {
        status.textContent = text || "";
      });
    </script>
  </body>
</html>
