<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Assistant Console</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    :root {
      --bg:#0a0f1c; --panel:#111827; --panel-2:#0d1424; --border:#1f2937;
      --text:#e5e7eb; --muted:#8b95a7; --accent:#0055ff; --on:#34d399; --danger:#ef4444;
    }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
      font:14px -apple-system, system-ui, sans-serif; overflow:hidden; }
    body { display:flex; }

    #sidebar { width:240px; flex:none; background:var(--panel-2);
      border-right:1px solid var(--border); display:flex; flex-direction:column;
      transition:width .15s ease; }
    #sidebar.collapsed { width:60px; }
    .side-head { display:flex; align-items:center; gap:8px; padding:12px 12px;
      border-bottom:1px solid var(--border); }
    .brand { font-weight:700; white-space:nowrap; overflow:hidden; }
    #sidebar.collapsed .brand, #sidebar.collapsed .side-label { display:none; }
    #collapse { margin-left:auto; background:none; border:1px solid var(--border);
      color:var(--muted); width:28px; height:28px; border-radius:6px; cursor:pointer; }
    #sidebar.collapsed #collapse { margin:0 auto; }
    #session-list { flex:1; overflow-y:auto; padding:8px; display:flex;
      flex-direction:column; gap:4px; }
    .session-item { display:flex; align-items:center; gap:8px; padding:8px 10px;
      border-radius:8px; cursor:pointer; color:var(--text); border:1px solid transparent; }
    .session-item:hover { background:var(--panel); }
    .session-item.active { background:var(--panel); border-color:var(--accent); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
    .session-item.reading .dot { background:var(--on); }
    .session-item.exited .dot { background:var(--danger); }
    .session-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session-close { background:none; border:none; color:var(--muted); cursor:pointer;
      font-size:16px; line-height:1; padding:0 2px; }
    #sidebar.collapsed .session-name, #sidebar.collapsed .session-close { display:none; }
    #new-session { margin:8px; padding:10px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; cursor:pointer; font-weight:600; }

    #main { flex:1; display:flex; flex-direction:column; min-width:0; }
    #toolbar { display:flex; gap:8px; align-items:center; padding:10px 16px;
      border-bottom:1px solid var(--border); }
    #toolbar.hidden, #terminals.hidden, footer.hidden, #start.hidden { display:none; }
    #stats { display:flex; gap:18px; align-items:center; margin-left:auto;
      color:var(--muted); font-size:12px; min-width:0; overflow:hidden; }
    .stat { white-space:nowrap; }
    .stat b { color:var(--text); font-weight:600; }

    #terminals { flex:1; position:relative; min-height:0; }
    .term-pane { position:absolute; inset:0; padding:8px; display:none; }
    .term-pane.active { display:block; }

    #start { flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:16px; }
    #start p { color:var(--muted); margin:0; }
    #start-btn { width:72px; height:72px; border-radius:50%; border:none;
      background:var(--accent); color:#fff; font-size:34px; cursor:pointer; }

    #mic, #read { background:var(--panel); border:1px solid var(--border); color:var(--text);
      padding:9px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; }
    #mic.active, #read.active { background:var(--on); color:#04231a; border-color:var(--on); }
    #stop-speak { background:transparent; border:1px solid var(--danger); color:var(--danger);
      padding:9px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; }
    #stop-speak:hover { background:var(--danger); color:#fff; }

    footer { display:flex; gap:12px; align-items:center; padding:8px 16px;
      border-top:1px solid var(--border); }
    #heard { flex:1; min-width:0; color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #heard.filled { color:var(--text); }
    #status { color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">Assistant&nbsp;Console</div>
      <button id="collapse" title="Collapse sidebar">«</button>
    </div>
    <div id="session-list"></div>
    <button id="new-session" title="New session">+<span class="side-label">&nbsp;New session</span></button>
  </aside>

  <div id="main">
    <header id="toolbar" class="hidden">
      <button id="mic">Start listening</button>
      <button id="read">Start reading</button>
      <div id="stats">
        <div class="stat">Context <b id="stat-context">—</b></div>
        <div class="stat">In <b id="stat-in">—</b></div>
        <div class="stat">Out <b id="stat-out">—</b></div>
        <div class="stat">Cache read <b id="stat-cache-read">—</b></div>
        <div class="stat">Cache write <b id="stat-cache-write">—</b></div>
        <div class="stat">Messages <b id="stat-messages">—</b></div>
        <div class="stat" id="stat-model">—</div>
      </div>
      <button id="stop-speak">Stop speaking</button>
    </header>

    <div id="start">
      <button id="start-btn" title="Open a terminal">+</button>
      <p>Open a terminal to start a Claude session</p>
    </div>

    <div id="terminals" class="hidden"></div>

    <footer class="hidden">
      <div id="heard"></div>
      <div id="status">terminal</div>
    </footer>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.19/dist/bundle.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
